<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Folio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Jost:wght@200;300;400;500&family=Poiret+One&family=Cinzel:wght@400;500&display=swap">
<style>
/* Layout: one quiet white room — a 3D coverflow shelf in the middle, a hairline caption beneath, a timeline of publication years as the index. */
:root{
  --bg:#ffffff;
  --ink:#17171a;
  --mute:#8d8c95;
  --hair:#e8e7ec;
  --soft:#f5f5f7;
  --accent:#1f4a6b;
  --display:"Cormorant Garamond","Iowan Old Style","Times New Roman",serif;
  --ui:"Jost","Helvetica Neue",Arial,sans-serif;
  --text:"Newsreader","Iowan Old Style",Georgia,serif;
  --w:200px; --h:300px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
main{min-height:100%;display:grid;grid-template-rows:auto minmax(360px,1fr) auto auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px;position:relative}

header{display:flex;align-items:center;justify-content:space-between;padding-block:22px 0;max-width:1200px;width:100%;margin:0 auto}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--ui);font-weight:200;font-size:15px;letter-spacing:.42em;text-transform:lowercase}
.mark svg{width:18px;height:18px}
.count{font-weight:200;font-size:12px;letter-spacing:.2em;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.count b{font-weight:300;color:var(--ink)}
.count i{display:block;width:28px;height:1px;background:var(--hair)}
.day{position:relative;display:grid;place-items:center;margin-right:14px;color:var(--ink)}
.day svg{display:block}
[data-tip].tipdown::after{bottom:auto;top:calc(100% + 10px);transform:translate(-50%,-4px)}
[data-tip].tipdown:hover::after,[data-tip].tipdown:focus-visible::after{transform:translate(-50%,0)}
.day:focus-visible{outline:1px solid var(--ink);outline-offset:4px}

/* ---------- stage ---------- */
.halo{position:absolute;left:50%;top:44%;width:min(70vw,720px);aspect-ratio:1.4;max-width:100%;transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);filter:blur(90px);opacity:.13;transition:background-color 1s ease;pointer-events:none}
.viewport{position:relative;perspective:1500px;perspective-origin:50% 42%;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.viewport.dragging{cursor:grabbing}
.stage{position:absolute;inset:0;transform-style:preserve-3d}
.slot{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.book{position:absolute;width:var(--w);height:var(--h);left:calc(var(--w) / -2);top:calc(var(--h) / -2);transform-style:preserve-3d}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face .sh{position:absolute;inset:0;background:#07070a;opacity:var(--s,0);pointer-events:none}
.front,.back{inset:0}
.front{transform:translateZ(calc(var(--d) / 2));border-radius:1px 3px 3px 1px;isolation:isolate}
.back{transform:rotateY(180deg) translateZ(calc(var(--d) / 2));border-radius:3px 1px 1px 3px;isolation:isolate}
.front svg{display:block;width:100%;height:100%}
.spine{width:var(--d);height:100%;left:calc((var(--w) - var(--d)) / 2);transform:rotateY(-90deg) translateZ(calc(var(--w) / 2));border-radius:2px;display:flex;align-items:center;justify-content:center}
.spine::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.14) 28%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.45))}
.spine span{position:relative;writing-mode:vertical-rl;font-family:var(--ui);font-weight:400;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;font-size:calc(var(--w) * .042)}
.spine .bands{position:absolute;left:0;right:0;height:calc(var(--d) * .5);border-top:1px solid;border-bottom:1px solid;opacity:.55}
.spine .bands.t{top:7%}.spine .bands.b{bottom:7%}
.edge-r{width:calc(var(--d) - 4px);height:calc(100% - 6px);top:3px;left:calc((var(--w) - var(--d) + 4px) / 2);transform:rotateY(90deg) translateZ(calc(var(--w) / 2 - 3px));
  background:linear-gradient(90deg,rgba(0,0,0,.2),transparent 18%,transparent 82%,rgba(0,0,0,.22)),linear-gradient(180deg,rgba(255,255,255,.2),rgba(0,0,0,.08)),repeating-linear-gradient(90deg,#f8f3e8 0 1px,#e4dccb 1px 2px,#f1ebdd 2px 3px)}
.edge-t,.edge-b{width:calc(var(--w) - 5px);height:calc(var(--d) - 4px);left:2px;top:calc((var(--h) - var(--d) + 4px) / 2);
  background:linear-gradient(90deg,rgba(0,0,0,.12),transparent 12%),repeating-linear-gradient(0deg,#f8f3e8 0 1px,#e4dccb 1px 2px,#f1ebdd 2px 3px)}
.edge-t{transform:rotateX(90deg) translateZ(calc(var(--h) / 2 - 3px))}
.edge-b{transform:rotateX(-90deg) translateZ(calc(var(--h) / 2 - 3px))}
.shadow{position:absolute;width:calc(var(--w) * 1.35);height:calc(var(--w) * .95);left:calc(var(--w) * -.1);top:calc((var(--h) - var(--w) * .95) / 2);
  transform:rotateX(90deg) translateZ(calc(var(--h) / -2 - 22px));background:radial-gradient(closest-side,rgba(24,22,30,.34),rgba(24,22,30,.12) 55%,transparent);filter:blur(12px);pointer-events:none}

/* cover overlays: grain, cloth, light, hinge, glare */
.ov{position:absolute;inset:0;pointer-events:none}
.grain{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay;opacity:.32}
.cloth{background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.paper .grain{opacity:.5}
.light{background:linear-gradient(118deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 58%,rgba(0,0,0,.26) 100%)}
.hinge{background:linear-gradient(90deg,rgba(0,0,0,.34) 0,rgba(0,0,0,0) 2.4%,rgba(255,255,255,.16) 4.2%,rgba(0,0,0,.26) 5.9%,rgba(255,255,255,.1) 7.2%,rgba(255,255,255,0) 10%)}
.glare{background:radial-gradient(ellipse 70% 50% at var(--gx,28%) var(--gy,18%),rgba(255,255,255,.55),rgba(255,255,255,0) 70%);mix-blend-mode:overlay;opacity:.9}
.edgeline{box-shadow:inset 0 0 0 .6px rgba(255,255,255,.1),inset 0 -1px 2px rgba(0,0,0,.3)}

/* back cover */
.back .bc{position:absolute;inset:0;padding:12% 11% 10% 13%;display:flex;flex-direction:column;gap:7%}
.back .bc p{margin:0;font-family:var(--display);font-weight:400;font-size:calc(var(--w) * .062);line-height:1.38}
.back .bc .one{font-style:italic;font-size:calc(var(--w) * .057);opacity:.75}
.back .bc .rule{width:22%;height:1px;background:currentColor;opacity:.4}
.back .barcode{margin-top:auto;align-self:flex-end;background:#fbf9f3;padding:5px 6px 4px;border-radius:1px;width:38%}
.back .barcode svg{display:block;width:100%;height:auto}

/* side controls */
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:none;color:var(--ink);opacity:0;transition:opacity .35s;cursor:pointer;display:grid;place-items:center;z-index:5;border-radius:50%}
.nav svg{width:22px;height:22px}
.nav.prev{left:max(4px,env(safe-area-inset-left,0px))}.nav.next{right:max(4px,env(safe-area-inset-right,0px))}
.viewport:hover .nav{opacity:.45}.nav:hover{opacity:.9!important}
.nav:focus-visible{opacity:.9;outline:1px solid var(--ink)}
@media (hover:none){.nav{display:none}}

/* ---------- caption ---------- */
.details{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:6px 4px;min-height:150px}
.details h1{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(30px,4.4vw,52px);line-height:1.05;letter-spacing:.005em;text-wrap:balance}
.author{position:relative;font-size:11px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:var(--mute);padding-left:.34em}
.glyphs{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,26px);margin-top:12px;flex-wrap:wrap}
.g{position:relative;display:flex;align-items:center;gap:6px;height:26px;color:var(--ink);background:none;border:0;padding:0 2px;font:inherit;cursor:default}
.g svg{display:block}
.g.btn{cursor:pointer}
.g:focus-visible,.author:focus-visible{outline:1px solid var(--ink);outline-offset:4px;border-radius:2px}
.dot{width:3px;height:3px;border-radius:50%;background:var(--hair)}
.stack{display:flex;align-items:flex-end;gap:1.5px;height:16px}
.stack i{display:block;width:1px;background:var(--ink);opacity:.7}
.flipicon{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.flipped .flipicon{transform:rotateY(180deg)}

/* hover-tucked info */
[data-tip]::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,4px);background:var(--bg);color:var(--ink);border:1px solid var(--hair);box-shadow:0 10px 30px -12px rgba(20,20,30,.18);padding:7px 11px 8px;border-radius:2px;font-family:var(--ui);font-weight:300;font-size:12px;letter-spacing:.04em;text-transform:none;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
[data-tip].wide::after{white-space:normal;width:220px;font-family:var(--display);font-style:italic;font-size:15px;line-height:1.3;letter-spacing:0;text-align:center}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}

/* ---------- timeline ---------- */
.rail{position:relative;width:min(620px,100%);margin:22px auto 0;height:58px}
.rail .line{position:absolute;left:0;right:0;top:34px;height:1px;background:var(--hair)}
.rail .tick{position:absolute;top:31px;width:1px;height:7px;background:var(--hair)}
.rail .tick.major{height:11px;top:29px;background:#d6d5dc}
.rail .lab{position:absolute;top:46px;transform:translateX(-50%);font-size:10px;font-weight:200;letter-spacing:.14em;color:var(--mute);font-variant-numeric:tabular-nums}
.rail button{position:absolute;top:34px;width:22px;height:22px;margin:-11px 0 0 -11px;border:0;padding:0;background:none;cursor:pointer;display:grid;place-items:center}
.rail button span{display:block;width:5px;height:5px;border-radius:50%;background:var(--bg);border:1px solid #a9a8b1;transition:transform .35s,background .35s,border-color .35s}
.rail button:hover span{transform:scale(1.4);border-color:var(--ink)}
.rail button.on span{background:var(--accent);border-color:var(--accent);transform:scale(1.6)}
.rail button.qz span{border-radius:1px;transform:rotate(45deg)}
.rail button.qz:hover span{transform:rotate(45deg) scale(1.4)}
.rail button.qz.on span{transform:rotate(45deg) scale(1.6)}
.rail button::after{bottom:calc(100% + 4px)}
.rail .year{position:absolute;top:0;transform:translateX(-50%);font-size:12px;font-weight:300;letter-spacing:.18em;font-variant-numeric:tabular-nums;transition:left .7s cubic-bezier(.2,.7,.2,1);padding-left:.18em}
.rail .stem{position:absolute;top:18px;width:1px;height:12px;background:var(--accent);transition:left .7s cubic-bezier(.2,.7,.2,1),background-color 1s}

.swap{animation:swap .55s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{0%{opacity:0;transform:translateY(8px);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}

@media (max-width:520px){
  .glyphs{gap:16px}
  .details{min-height:170px}
}
@media (prefers-reduced-motion:reduce){
  .swap{animation:none}
  .rail .year,.rail .stem,.flipicon{transition:none}
}

/* ---------- reader ---------- */
.slot.away{opacity:0}
.slot.center .book{cursor:pointer}
.reader{position:fixed;inset:0;z-index:50;outline:none;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.r-veil{position:absolute;inset:0;background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(18px) saturate(1.1);backdrop-filter:blur(18px) saturate(1.1);opacity:0}
.r-glow{position:absolute;left:50%;top:50%;width:min(92vw,1040px);aspect-ratio:1.7;transform:translate(-50%,-50%);border-radius:50%;background:var(--accent);filter:blur(120px);opacity:0;pointer-events:none}
.r-scene{position:absolute;inset:0;perspective:2600px;pointer-events:none}
.r-rig{position:absolute;transform-style:preserve-3d;transform-origin:50% 50%;pointer-events:auto}

.pgf{position:absolute;inset:0;overflow:hidden;background:#fbf9f4;color:#2a2830;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pc{position:absolute;inset:0}
.pgf .ov.grain{opacity:.16;mix-blend-mode:multiply}
.r-board{position:absolute;inset:calc(var(--r-o) * -1) calc(var(--r-o) * -1.3) calc(var(--r-o) * -1) 0;border-radius:1px 4px 4px 1px;transform:translateZ(-2px);
  box-shadow:0 46px 70px -34px rgba(16,14,24,.5),0 14px 26px -14px rgba(16,14,24,.32)}
.r-spine{position:absolute;left:calc(var(--r-d) * -1);top:calc(var(--r-o) * -1);height:calc(100% + var(--r-o) * 2);width:var(--r-d);transform-origin:100% 50%;transform:translateZ(2px) rotateY(-90deg);
  display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:2px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.r-spine::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.14) 28%,rgba(255,255,255,.04) 45%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.45))}
.r-spine span{position:relative;writing-mode:vertical-rl;font-family:var(--ui);font-weight:400;letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;font-size:calc(var(--r-d) * .4)}
.r-right{transform:translateZ(0);box-shadow:1px 0 0 #ebe5d7,2px 1px 0 #f8f4ea,3px 1px 0 #e4ddcd,4px 2px 0 #f5f0e5,5px 2px 0 #ddd5c3}
.r-left{left:-100%;right:100%;transform:translateZ(0);visibility:hidden;box-shadow:-1px 0 0 #ebe5d7,-2px 1px 0 #f8f4ea,-3px 1px 0 #e4ddcd,-4px 2px 0 #f5f0e5,-5px 2px 0 #ddd5c3}
.leaf{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:0 50%;visibility:hidden}
.leaf .b{transform:rotateY(180deg)}
.leaf.cv{inset:calc(var(--r-o) * -1) calc(var(--r-o) * -1.3) calc(var(--r-o) * -1) 0;visibility:visible}
.leaf.cv .f{border-radius:1px 4px 4px 1px;isolation:isolate;background:#111}
.leaf.cv .f svg{display:block;width:100%;height:100%}
.leaf.cv .b{border-radius:4px 1px 1px 4px}
.r-sh{position:absolute;inset:0;background:linear-gradient(90deg,#0c0a12,#1d1a24);opacity:0;pointer-events:none}
.cast{position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,16,24,.5),rgba(20,16,24,.16) 40%,rgba(20,16,24,0) 85%);opacity:0;pointer-events:none}
.gut{position:absolute;inset:0;pointer-events:none}
.gut.l{background:linear-gradient(90deg,rgba(70,52,30,.26),rgba(70,52,30,.09) 2.5%,rgba(70,52,30,.03) 7%,rgba(70,52,30,0) 14%)}
.gut.r{background:linear-gradient(270deg,rgba(70,52,30,.26),rgba(70,52,30,.09) 2.5%,rgba(70,52,30,.03) 7%,rgba(70,52,30,0) 14%)}

/* endpaper */
.endp{position:absolute;inset:0}
.endp > svg{position:absolute;inset:0;width:100%;height:100%}
.plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36%;aspect-ratio:.78;border-radius:50%;background:#f6f1e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:inset 0 0 0 4px #f6f1e4,inset 0 0 0 4.7px currentColor,0 1px 3px rgba(0,0,0,.3)}
.plate span{font-family:var(--display);font-style:italic;font-size:12px;letter-spacing:.06em;color:#6c6872}

/* typeset pages */
.rh,.fo{position:absolute;left:0;right:0;text-align:center;font-family:var(--ui);font-weight:300;font-size:9px;letter-spacing:.32em;text-transform:uppercase;color:#a9a7ae;padding-left:.32em}
.rh{top:calc(var(--r-padt) * .42)}
.fo{bottom:calc(var(--r-padb) * .38);font-size:10px;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.pg-in{position:absolute;left:var(--r-padx);top:var(--r-padt);width:var(--r-iw);height:var(--r-ih);overflow:hidden}
.flow{width:var(--r-iw);height:var(--r-ih);column-width:var(--r-iw);column-gap:var(--r-gap);column-fill:auto;font-family:var(--display);font-weight:400;font-size:var(--r-fs);line-height:1.52;
  color:#2a2830;text-align:justify;hyphens:auto;-webkit-hyphens:auto;orphans:2;widows:2}
.flow p{margin:0}
.flow p + p{text-indent:1.3em}
.flow em{font-style:italic}
.flow strong{font-weight:600;color:#1d1c22}
.flow h2{font-family:var(--ui);font-weight:300;font-size:.6em;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin:2.4em 0 1.2em;display:flex;align-items:center;gap:.9em;break-after:avoid;text-align:left}
.flow h2::before{content:"";width:2em;height:1px;background:currentColor;opacity:.55;flex:none}
.flow ul{list-style:none;margin:0;padding:0}
.flow li{position:relative;padding-left:1.15em;margin:.32em 0;break-inside:avoid;text-align:left;hyphens:manual}
.flow li::before{content:"";position:absolute;left:0;top:.78em;width:.55em;height:1px;background:var(--accent)}
.flow hr{border:0;height:1px;width:30%;margin:1.6em auto;background:#dcd8d0}
.opening + h2 + p::first-letter{float:left;font-size:3.4em;line-height:.8;padding:.07em .09em 0 0;color:var(--accent);font-weight:400}
.opening{height:var(--r-ih);break-after:column;break-inside:avoid;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.opening .ico{color:var(--accent);margin-bottom:1.4em;opacity:.9}
.opening h1{margin:0;font-weight:300;font-size:2.35em;line-height:1.04;text-wrap:balance;color:#1d1c22}
.opening p{margin:.5em 0 0;font-style:italic;color:#77747d}
.opening blockquote{margin:1.9em 0 0;font-style:italic;font-size:1.06em;line-height:1.4;max-width:15em;color:#4a4750;text-wrap:balance}
.opening blockquote::before{content:"";display:block;width:28px;height:1px;background:var(--accent);margin:0 auto 1.3em}
.opening .by{margin-top:2.6em;font-family:var(--ui);font-weight:300;font-size:.56em;letter-spacing:.34em;text-transform:uppercase;color:#8d8c95;padding-left:.34em}
.opening .yr{margin-top:.7em;font-family:var(--ui);font-weight:200;font-size:.62em;letter-spacing:.18em;color:#a9a7ae;font-variant-numeric:tabular-nums}
.r-measure{position:fixed;left:-20000px;top:0;visibility:hidden;pointer-events:none}

/* reading mode: big, flat, quiet pages */
.r-morph{position:absolute;inset:0;pointer-events:none}
.mp{position:absolute;background:#fdfcf9;transform-origin:0 0;box-shadow:0 24px 60px -34px rgba(20,18,30,.3)}
.r-veil{transition:background-color .9s ease}
.reader.reading .r-veil{background-color:rgba(255,255,255,.95)}
.r-rig.reading .r-board,.r-rig.reading .r-spine,.r-rig.reading .leaf.cv{visibility:hidden}
.r-rig.reading .pgf{background:#fdfcf9}
.r-rig.reading .ov.grain{display:none}
.r-rig.reading .r-right,.r-rig.reading .r-left{box-shadow:0 24px 60px -34px rgba(20,18,30,.28)}

<script type="text/markdown" data-md="moby">
# Moby-Dick
*or, The Whale*

> One captain, one whale, and an ocean too large for either.

## Setting out
Ishmael, restless and short of money, heads to New Bedford and then Nantucket to ship out on a whaler. At a crowded inn he is made to share a bed with Queequeg, a tattooed harpooneer from the South Seas, and the two quickly become close friends. Together they sign on to the *Pequod*, an old ship trimmed with the teeth and bones of whales.

## The captain
For days the ship's master stays out of sight. When Captain Ahab finally appears on deck, standing on a leg carved from a whale's jawbone, he nails a gold doubloon to the mast and reveals the real purpose of the voyage: to find and kill Moby Dick, the white sperm whale that took his leg. The crew is swept up in his fury. Only Starbuck, the careful first mate, says that vengeance on a dumb animal is madness.

## The long middle
The book widens out like the sea. Ishmael pauses the story for chapters on whale anatomy, the classification of whales, the hunt, the boiling of blubber, the color white, and the meaning of almost everything. In between, the *Pequod* meets other ships, and Ahab asks each the same question: have you seen the White Whale? The answers grow darker as the voyage goes on.

## The chase
In the Pacific, Moby Dick is finally sighted. The chase lasts three days. Boats are smashed, men are lost, and Ahab refuses every chance to turn back. On the third day the whale rams and sinks the *Pequod*. Ahab, caught in his own harpoon line, is dragged under. Ishmael alone survives, floating on Queequeg's coffin until another ship picks him up.

## Characters
- **Ishmael** — the narrator; curious, funny and open to the world.
- **Ahab** — the captain; brilliant, wounded and consumed.
- **Starbuck** — the first mate; the voice of reason and faith.
- **Queequeg** — harpooneer, and Ishmael's closest friend.
- **Moby Dick** — the whale; never explained, only met.

## Themes
- Obsession, and the will to master nature
- The limits of what anyone can know
- Friendship across every line of race and creed
- Fate, free will, and the ship as a small world

## Why read it
It is an adventure, an encyclopedia, a sermon and a stage play all at once. Few novels are this strange, or this alive.
</script>

<script type="text/markdown" data-md="pride">
# Pride and Prejudice

> First impressions, thoroughly revised.

## The Bennets
The Bennets of Longbourn have five daughters and no son, so their estate will pass to a distant cousin when Mr. Bennet dies. Mrs. Bennet's one aim in life is to see her girls well married. When the wealthy, good-natured Mr. Bingley rents nearby Netherfield Park, she is delighted.

## A bad beginning
At a local ball, Bingley is taken with the eldest daughter, Jane. His friend Mr. Darcy, richer and far prouder, refuses to dance and is overheard dismissing Elizabeth as merely tolerable. Elizabeth laughs it off, but decides she dislikes him. Her opinion hardens when the charming officer George Wickham tells her Darcy cheated him out of an inheritance.

## Two proposals
Elizabeth turns down a pompous proposal from Mr. Collins, the cousin who will inherit Longbourn; he promptly marries her friend Charlotte Lucas instead. Bingley leaves for London without a word, and Jane is heartbroken. Then, visiting Charlotte in Kent, Elizabeth receives a second proposal — from Darcy, who admits he loves her against his better judgment. She refuses him angrily, accusing him of ruining Jane's happiness and wronging Wickham.

## The letter
Darcy replies in a letter. He did separate Bingley from Jane, believing her indifferent. But Wickham, he explains, is a liar who wasted his money and tried to elope with Darcy's fifteen-year-old sister. Elizabeth realizes she has been as prejudiced as he was proud.

## Turning point
Touring Darcy's estate, Pemberley, Elizabeth meets him by chance and finds him gracious and changed. Then news arrives that her youngest sister, Lydia, has run off with Wickham, a scandal that could ruin the whole family. Darcy quietly finds the pair and pays Wickham to marry her, asking that no one be told. Elizabeth learns of it anyway. Bingley returns and proposes to Jane, and when Darcy asks Elizabeth once more, she accepts.

## Characters
- **Elizabeth Bennet** — witty, independent, quick to judge.
- **Fitzwilliam Darcy** — reserved and honorable, slow to show it.
- **Jane Bennet** — gentle, inclined to think well of everyone.
- **Mr. and Mrs. Bennet** — a dry, detached father and an anxious, matchmaking mother.
- **George Wickham** — charming on the surface, rotten underneath.
- **Lady Catherine de Bourgh** — Darcy's imperious aunt, who tries to forbid the match.

## Themes
- Pride, prejudice, and the work of knowing yourself
- Marriage, money and the narrow choices open to women
- Class and manners, as both armor and disguise

## Why read it
Austen's comedy is so sharp it still cuts. Nearly every sentence is doing two things at once.
</script>

<script type="text/markdown" data-md="frank">
# Frankenstein
*or, The Modern Prometheus*

> A maker who runs, and a creation who follows.

## A story inside a story
The novel opens with letters from Robert Walton, an explorer pushing toward the North Pole. His ship is trapped in ice when the crew pulls aboard a half-frozen stranger: Victor Frankenstein, who tells Walton his story as a warning.

## The experiment
Victor grows up in Geneva, fascinated by natural philosophy. At university in Ingolstadt he discovers how to give life to dead matter. Working alone for nearly two years, he assembles a body and brings it to life — and is so horrified by what he sees that he flees. The creature disappears.

## The creature's tale
Victor's young brother William is murdered, and the family servant Justine is wrongly hanged for it. Victor knows the creature is to blame. High in the Alps, the creature finds him and asks to be heard. He describes his first confused days, hiding beside a cottage, learning language by watching a family through a gap in the wall, and reading *Paradise Lost*. When at last he shows himself, the family drives him away in terror. Rejected by everyone, he turned to revenge. Now he asks for one thing: a companion as strange as he is.

## The bargain broken
Victor agrees, then destroys the half-made companion in disgust. The creature vows to be with him on his wedding night. He kills Victor's friend Henry Clerval and, on the night of the wedding, Victor's bride Elizabeth. Victor's father dies of grief.

## The ice
Victor pursues the creature across Europe and into the Arctic, which is where Walton found him. Victor dies aboard the ship. The creature comes to mourn over the body, tells Walton he will end his own life, and drifts away into the dark on a raft of ice.

## Characters
- **Victor Frankenstein** — the ambitious scientist who will not take responsibility.
- **The creature** — never named; eloquent, lonely, capable of great tenderness and great violence.
- **Robert Walton** — the explorer who listens, and turns back.
- **Elizabeth Lavenza** — Victor's adopted sister, and his bride.

## Themes
- What a maker owes to what is made
- Ambition without foresight
- Isolation, and the hunger to belong
- Who the real monster is

## Why read it
Begun when Mary Shelley was eighteen, it helped invent science fiction, and it still asks the right questions about what we build.
</script>

<script type="text/markdown" data-md="gatsby">
# The Great Gatsby

> A party thrown, night after night, for one absent guest.

## West Egg, 1922
Nick Carraway, a young Midwesterner learning the bond business, rents a small house on Long Island beside an enormous mansion. Across the bay live his cousin Daisy and her husband Tom Buchanan: rich, careless and bored. Tom keeps a mistress, Myrtle Wilson, the wife of a garage owner in the grim valley of ashes between the suburbs and New York.

## The neighbor
Every weekend Nick's neighbor, Jay Gatsby, throws vast parties that half of New York attends uninvited. Nobody seems to know who he is. In truth, Gatsby was born poor as James Gatz, fell for Daisy as a young officer, and lost her while he was away at war. He has since made a fortune, partly through bootlegging, and bought his house so he can look across the water at the green light on her dock.

## Reunion
Gatsby asks Nick to invite Daisy to tea. The meeting is awkward, then electric, and the two begin an affair. Gatsby wants more than love; he wants Daisy to say she never loved Tom, as if the past five years could be undone.

## The Plaza
On a sweltering afternoon in Manhattan, Tom confronts Gatsby and exposes his shady business. Daisy wavers, and Gatsby's dream begins to crack. Driving home in Gatsby's car, Daisy hits and kills Myrtle, who has run into the road. Gatsby decides to take the blame.

## The end of summer
Tom lets Myrtle's husband, George, believe the car's owner was her lover and her killer. Wilson shoots Gatsby in his pool, then himself. Almost no one comes to the funeral. Tom and Daisy leave town. Nick, sick of the East, heads home, thinking about Gatsby's faith in a future that keeps moving away.

## Characters
- **Nick Carraway** — the narrator, half insider and half judge.
- **Jay Gatsby** — self-invented, hopeful to the point of tragedy.
- **Daisy Buchanan** — lovely and charming, and finally unwilling to choose.
- **Tom Buchanan** — brutal old money.
- **Jordan Baker** — Daisy's friend, a cool golf champion.

## Themes
- The American Dream and its price
- Old money, new money and the walls between them
- The impossibility of repeating the past
- The carelessness of the very rich

## Why read it
Short enough for an afternoon and deep enough for a lifetime. The prose glitters like the parties it describes.
</script>

<script type="text/markdown" data-md="dune">
# Dune

> Sand, spice, and a prophecy someone planted long ago.

## Arrakis
In the far future, a galactic empire runs on melange — the spice — a substance that extends life, expands the mind and makes space travel possible. It is found on only one world: Arrakis, a desert planet known as Dune, home to giant sandworms and the fierce, secretive Fremen. The Emperor orders Duke Leto Atreides to take over Arrakis from his rivals, the Harkonnens. Leto suspects a trap, and goes anyway.

## The fall of House Atreides
Leto brings his concubine, Lady Jessica, a member of the Bene Gesserit sisterhood, and their fifteen-year-old son Paul, whom Jessica has secretly trained in the sisterhood's skills. Within weeks a traitor lowers the household's defenses, and the Harkonnens, backed by the Emperor's elite Sardaukar, attack. Leto is killed. Paul and Jessica escape into the deep desert.

## Among the Fremen
The Fremen take them in. Paul earns his place in a duel to the death, takes the name Muad'Dib, and learns to live as they do: stillsuits, hidden cave communities, riding the sandworms. The spice awakens his visions of the future, and he sees a holy war fought in his name across the galaxy. The Fremen believe he is their promised messiah — a legend seeded among them centuries earlier by the Bene Gesserit.

## The reckoning
Paul drinks the Water of Life, a poison only Bene Gesserit women are supposed to survive, and wakes with full sight of what is coming. He leads the Fremen, mounted on sandworms, against the Harkonnens and the Emperor himself. Holding the spice hostage, he forces the Emperor to give up his throne and his daughter's hand. Paul has won, and he knows he can no longer stop the war to come.

## Characters
- **Paul Atreides** — heir, outcast, prophet.
- **Lady Jessica** — his mother, torn between love and the sisterhood.
- **Duke Leto** — honorable to a fault.
- **Baron Harkonnen** — the grotesque schemer behind the coup.
- **Chani** — a Fremen woman who becomes Paul's partner.
- **Stilgar** — leader of the community that shelters them.

## Themes
- Ecology, and the way a planet shapes its people
- Power, religion and the danger of saviors
- Fate against choice

## Why read it
A complete world, built down to its water rituals, and a hero's story that quietly warns against heroes.
</script>

<script type="text/markdown" data-md="orwell">
# Nineteen Eighty-Four

> Even your thoughts are on the record.

## Airstrip One
Britain is now Airstrip One, a province of Oceania, one of three superstates locked in endless war. The Party rules through constant surveillance, telescreens in every room, and a leader, Big Brother, whose face is on every wall. Winston Smith works at the Ministry of Truth, rewriting old newspaper articles so the past always agrees with the Party.

## The diary
Winston privately hates the Party. He buys a notebook from a junk shop in the poor district where the proles live and begins a diary — a crime punishable by death. He wonders whether a resistance called the Brotherhood really exists, and suspects that O'Brien, a senior Party member, might belong to it.

## Julia
A young woman from the Fiction Department slips Winston a note confessing her love. Julia rebels in her own practical way, through pleasure and small deceptions. They meet in secret, and eventually rent a room above the junk shop where they believe no one is watching.

## The Brotherhood
O'Brien invites them to his apartment and swears them into the Brotherhood, then gives Winston a forbidden book said to explain how the Party keeps its power. Soon after, the Thought Police burst into the room. The shopkeeper was one of them, and O'Brien has been a loyal Party man all along.

## The Ministry of Love
Over months of torture, O'Brien works to break Winston, not just to make him obey but to make him believe that two and two make five if the Party says so. In Room 101, faced with his worst fear, Winston betrays Julia. Released and hollowed out, he sits in a café, and finds that he loves Big Brother.

## Characters
- **Winston Smith** — a quiet clerk who dares to think.
- **Julia** — a rebel of the senses.
- **O'Brien** — the Party's patient inquisitor.
- **Big Brother** — perhaps a man, perhaps only a face.

## Words it gave us
- Doublethink, Newspeak, thoughtcrime
- Memory holes, and history rewritten daily
- The surveillance state as a household idea

## Why read it
More than seventy years on, it remains the clearest warning about what power does to language and truth.

<script type="text/markdown" data-md="hobbit">
# The Hobbit
*or There and Back Again*

> An unexpected journey, with a dragon at the end of it.

## An unexpected party
Bilbo Baggins is a respectable hobbit who likes his comforts and dislikes surprises. One morning the wizard Gandalf calls, and the next evening thirteen dwarves arrive at Bilbo's door, led by Thorin Oakenshield. They mean to win back their ancestral home and treasure beneath the Lonely Mountain from Smaug, the dragon who seized it long ago. Gandalf has told them Bilbo will be their burglar.

## The road east
The journey goes wrong almost at once. The company is nearly eaten by trolls, rests with the elves of Rivendell, and is captured by goblins in the Misty Mountains. Lost in the tunnels below, Bilbo finds a magic ring and wins a riddle contest against the creature Gollum, escaping invisible. Beyond the mountains come wolves, eagles, the shape-changer Beorn, giant spiders in the forest of Mirkwood, and imprisonment by the Wood-elves, from which Bilbo frees the dwarves by floating them out in barrels.

## The Lonely Mountain
At Lake-town the travelers are welcomed, then press on to the mountain. Bilbo creeps into the dragon's lair and talks with Smaug, spotting a bare patch in his jeweled armor. Enraged, Smaug attacks Lake-town, where the archer Bard, told of the weak spot by a thrush, shoots him dead.

## The Battle of Five Armies
With the dragon gone, men and elves come to claim a share of the treasure, but Thorin, gripped by gold-sickness, refuses. Bilbo secretly hands the Arkenstone, the dwarves' most precious jewel, to Bard as a bargaining piece. Before they can come to blows, an army of goblins and wolves arrives, and the peoples fight side by side. Thorin is mortally wounded, and makes peace with Bilbo before he dies.

## Home again
Bilbo returns to Bag End just in time to find his belongings being auctioned off, since everyone presumed him dead. He has a modest share of gold, a ring in his pocket, and a new reputation for being odd. He is perfectly happy.

## Characters
- **Bilbo Baggins** — reluctant, resourceful, braver than he knew.
- **Gandalf** — the wizard who sees more than he says.
- **Thorin Oakenshield** — a proud king in exile.
- **Smaug** — vain, clever, terrible.
- **Gollum** — a lonely creature with a precious secret.

## Themes
- Courage found in ordinary people
- Greed, and the sickness of hoarding
- Home, and why it is worth leaving

## Why read it
A bedtime story that grows into an epic, and the doorway into Middle-earth.
</script>

<script type="text/markdown" data-md="solitude">
# One Hundred Years of Solitude

> A family history that keeps rhyming with itself.

## Macondo
José Arcadio Buendía and his wife Úrsula Iguarán, who are also cousins, leave their village and found Macondo, a town in the Colombian jungle. At first it is an innocent place, so new that many things have no names. Each year a band of gypsies led by the wise Melquíades brings wonders — magnets, ice, alchemy — and José Arcadio becomes obsessed with science and the secrets of the world.

## Generations
The family grows, and its names repeat. The Aurelianos tend to be withdrawn and thoughtful; the José Arcadios, impulsive and strong. Úrsula, who lives well past a hundred, holds the household together through births, marriages, ghosts, and a plague of insomnia that makes the whole town forget the names of things.

## War
Colonel Aureliano Buendía leads thirty-two uprisings in a long civil war and loses every one. He survives a firing squad, a poisoning and his own attempt at suicide, and finally comes home to make little gold fishes in his workshop, melting them down and starting again.

## The banana company
The railroad arrives, and with it a foreign banana company that remakes Macondo. When the workers strike, soldiers massacre thousands in the square by the station. The bodies are carried away by train, and afterwards almost no one will believe it happened. Then it rains for four years, eleven months and two days.

## The parchments
In the end Macondo is decaying and the family has dwindled. The last Aureliano falls in love with his aunt, Amaranta Úrsula, and their child is born with a pig's tail, just as the family always feared. Alone, Aureliano finally deciphers Melquíades' parchments and finds they tell his family's whole history in advance. As he reads the final lines, a whirlwind wipes Macondo from the earth.

## Characters
- **José Arcadio Buendía** — the founder, dreamer and amateur scientist.
- **Úrsula Iguarán** — the family's spine for a century.
- **Colonel Aureliano Buendía** — the solitary warrior.
- **Melquíades** — the gypsy who wrote everything down.
- **Remedios the Beauty** — so lovely she rises to heaven while folding sheets.

## Themes
- Time as a circle, not a line
- Solitude, inherited like a family trait
- History, memory and forgetting
- The magic inside the everyday

## Why read it
It made magical realism famous around the world, and reads like a whole continent's memory folded into one family.

  const r=8, c=2*Math.PI*r, f=Math.min(h/16,1);
  return `<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="${r}" fill="none" stroke="var(--hair)" stroke-width="1"/>

function stack(pages){
  const n=Math.round(pages/45); let s='';
  for (let i=0;i<n;i++) s += `<i style="height:${(9+((i*7)%5)*.9+ (i/n)*4).toFixed(1)}px"></i>`;

/* tiny markdown renderer: headings, paragraphs, lists, quotes, rules, bold/italic */
function md(src){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  let out='', para=[], list=null, quote=[];
  const flush = () => {
    if (para.length){ out += `<p>${inl(para.join(' '))}</p>`; para=[]; }
    if (quote.length){ out += `<blockquote>${inl(quote.join(' '))}</blockquote>`; quote=[]; }
    if (list){ out += `</${list}>`; list=null; }
  };
  for (const raw of src.replace(/\r/g,'').split('\n')){
    const l = raw.trim(); let m;
    if (!l){ flush(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)/))){ flush(); out += `<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(l)){ flush(); out += '<hr>'; continue; }
    if ((m = l.match(/^>\s?(.*)/))){ if (para.length||list) flush(); quote.push(m[1]); continue; }
    if ((m = l.match(/^([-*]|\d+\.)\s+(.*)/))){
      const t = /\d/.test(m[1]) ? 'ol' : 'ul';
      if (para.length||quote.length||(list&&list!==t)) flush();
      if (!list){ out += `<${t}>`; list=t; }
      out += `<li>${inl(m[2])}</li>`; continue;
    }
    if (list||quote.length) flush();
    para.push(l);
  }
  flush(); return out;
}

  const z = leaf===rCover ? 2 : 6, up = z + lift*R.geo.W, sh = R.mode==='read' ? .16 : .34;
  leaf.style.visibility = 'visible';
  const o = {duration:reduce?1:dur, easing:EASE, direction:dir>0?'normal':'reverse', fill:'both'};
  const as = [leaf.animate([{transform:`translateZ(${z}px) rotateY(0deg)`},{transform:`translateZ(${up}px) rotateY(-90deg)`,offset:.5},{transform:`translateZ(${z}px) rotateY(-180deg)`}], o)];
  const f = leaf.querySelector('.f > .r-sh'), b = leaf.querySelector('.b > .r-sh'), c = rRight.querySelector('.cast');
  as.push(f.animate([{opacity:0},{opacity:sh,offset:.5},{opacity:sh}], o));
  as.push(b.animate([{opacity:sh},{opacity:sh,offset:.5},{opacity:0}], o));
  if (c) as.push(c.animate([{opacity:sh*1.7},{opacity:0,offset:.45},{opacity:0}], o));
  return Promise.all(as.map(a=>a.finished)).then(()=>{
    // an opened cover rests just under the pages so they stay on the crisp z=0 plane
    leaf.style.transform = `translateZ(${leaf===rCover&&dir>0?-2:z}px) rotateY(${dir>0?-180:0}deg)`;
    if (leaf===rCover) leaf.style.visibility = '';
    as.forEach(a=>a.cancel());
  });
}

function fromT(){
  layout();
  const rc = slots[R.i].front.getBoundingClientRect(), g = R.geo, s = rc.height/(g.H*1.04);
  return `translate3d(${(rc.left+rc.width/2-(g.x+g.W/2)).toFixed(1)}px,${(rc.top+rc.height/2-(g.y+g.H/2)).toFixed(1)}px,0) rotateX(${st.rx.toFixed(2)}deg) rotateY(${(16+st.ry).toFixed(2)}deg) scale(${s.toFixed(4)})`;
}
const midT = () => `translate3d(${R.geo.dbl ? -R.geo.W/2 : 0}px,0,0) rotateX(0deg) rotateY(0deg) scale(1)`;
const FIN = 'translate3d(0px,0,0) rotateX(0deg) rotateY(0deg) scale(1)';

/* book <-> reading: plain paper sheets cover the pages, glide to the new size, then dissolve to reveal the re-laid pages */
const sheets = g => (g.dbl ? [{x:g.x-g.W, y:g.y, w:g.W, h:g.H}] : []).concat([{x:g.x, y:g.y, w:g.W, h:g.H}]);
const flipT = (to, from) => `translate(${(from.x-to.x).toFixed(1)}px,${(from.y-to.y).toFixed(1)}px) scale(${(from.w/to.w).toFixed(4)},${(from.h/to.h).toFixed(4)})`;
async function morphTo(mode){
  const a = sheets(R.geo), b = sheets(geo(mode));
  morph.innerHTML = b.map(()=>'<div class="mp"></div>').join('');
  const mps = [...morph.children];
  mps.forEach((m,k)=>{ Object.assign(m.style,{left:b[k].x+'px', top:b[k].y+'px', width:b[k].w+'px', height:b[k].h+'px', transform:flipT(b[k],a[k]), opacity:0}); });
  await Promise.all([anim(scene,[{opacity:1},{opacity:0}],340), ...mps.map(m=>anim(m,[{opacity:0},{opacity:1}],340))]);
  R.mode = mode; R.r = 0;
  rig.classList.toggle('reading', mode==='read'); reader.classList.toggle('reading', mode==='read');
  applyGeo(); render();
  await Promise.all(mps.map((m,k)=>anim(m,[{transform:flipT(b[k],a[k])},{transform:'none'}], mode==='read'?780:620, GLIDE)));
  scene.style.opacity = 1;
  await Promise.all(mps.map(m=>anim(m,[{opacity:1},{opacity:0}],380)));
  morph.innerHTML = '';
}

async function openBook(i){
  if (R.open || R.busy || i!==st.idx) return;
  R.open = R.busy = true; R.i = i; R.book = BOOKS[i]; R.r = 0; R.mode = 'book';
  st.flip = st.flipT = 0; st.tx = st.ty = 0;
  try { await document.fonts.ready; } catch(_){}
  const b = R.book;
  R.html = b.quiz ? '' : bookHTML(b);
  R.words = b.quiz ? 0 : (document.querySelector(`script[data-md="${b.k}"]`)||{textContent:''}).textContent.split(/\s+/).length;
  $('rCoverF').className = 'pgf f '+(b.tex||'');
  $('rCoverF').innerHTML = `<svg viewBox="0 0 300 450" preserveAspectRatio="none" aria-hidden="true">${COVERS[b.k]('rc'+i+'-')}</svg>
    <div class="ov grain"></div>${b.tex==='cloth'?'<div class="ov cloth"></div>':''}<div class="ov light"></div><div class="ov hinge"></div><div class="ov edgeline"></div><div class="r-sh"></div>`;
  $('rCoverB').innerHTML = endpaper(b)+'<div class="gut r"></div><div class="r-sh"></div>';
  $('rSpine').style.cssText = `background:${b.base};color:${b.ink}`; $('rSpine').innerHTML = `<span>${b.title}</span>`;
  $('rBoard').style.background = b.base;
  reader.setAttribute('aria-label', b.title+(b.quiz?'':' — summary'));
  rig.classList.remove('reading'); reader.classList.remove('reading','ready');
  applyGeo();
  rCover.style.transform = 'translateZ(2px) rotateY(0deg)';
  rLeaf.style.visibility = 'hidden'; scene.style.opacity = 1; morph.innerHTML = '';
  render();
  reader.hidden = false;
  const from = fromT(); rig.style.transform = from;
  slots[i].slot.classList.add('away');
  anim(rVeil, [{opacity:0},{opacity:1}], 700);
  anim(rGlow, [{opacity:0},{opacity:.12}], 1600);
  await anim(rig, [{transform:from},{transform:midT()}], 720, GLIDE);
  await Promise.all([ turn(rCover, 1, 1350, .1), anim(rig, [{transform:midT()},{transform:FIN}], 1350, EASE) ]);
  await morphTo('read');
  updUI(); reader.classList.add('ready'); R.busy = false;
  reader.focus({preventScroll:true});
}

async function closeBook(){
  if (!R.open || R.busy) return;
  R.busy = true; reader.classList.remove('ready');
  if (R.mode==='read') await morphTo('book');
  await Promise.all([ turn(rCover, -1, 1150, .1), anim(rig, [{transform:FIN},{transform:midT()}], 1150, EASE) ]);
  const to = fromT();
  await Promise.all([ anim(rig, [{transform:midT()},{transform:to}], 680, 'cubic-bezier(.4,0,.2,1)'),
                      anim(rVeil, [{opacity:1},{opacity:0}], 680), anim(rGlow, [{opacity:.12},{opacity:0}], 500) ]);
  slots[R.i].slot.classList.remove('away');
  reader.hidden = true; R.open = R.busy = false;
  document.activeElement && document.activeElement.blur();
  if (R.book.quiz) select(st.idx);   // refresh the quiz progress glyphs
}

async function go(dir){
  if (!R.open || R.busy) return;
  const step = R.geo.dbl?2:1, r = R.r, nr = r + dir*step;
  if (nr<0 || nr>maxR()) return;
  R.busy = true;
  const lf = $('rLeafF'), lb = $('rLeafB'), rd = R.mode==='read', dur = rd ? 760 : 950, lift = rd ? .02 : .05;
  if (dir>0){
    setFace(lf, r, 'l'); setFace(lb, L(nr), 'r'); setFace(rRight, nr, 'l');
    await turn(rLeaf, 1, dur, lift);
    setLeft(L(nr));
  } else {
    setFace(lf, nr, 'l'); setFace(lb, L(r), 'r'); setLeft(L(nr));
    await turn(rLeaf, -1, dur, lift);
    setFace(rRight, nr, 'l');
  }
  rLeaf.style.visibility = 'hidden';
  R.r = nr; updUI(); R.busy = false;
}

/* reader input: tap a page to turn, swipe, or tap outside to close */
let rdx=0, rdy=0, rdown=false;
reader.addEventListener('pointerdown', e=>{ if (e.target.closest('button,.r-prog,.opt,.g')) return; rdown=true; rdx=e.clientX; rdy=e.clientY; });
reader.addEventListener('pointerup', e=>{
  if (!rdown) return; rdown=false;
  const dx = e.clientX-rdx, dy = e.clientY-rdy, g = R.geo;
  if (Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)) return go(dx<0?1:-1);
  if (Math.hypot(dx,dy)>8) return;
  const x0 = g.dbl ? g.x-g.W : g.x, inBook = e.clientX>x0 && e.clientX<g.x+g.W && e.clientY>g.y && e.clientY<g.y+g.H;
  if (!inBook) return closeBook();
  go((g.dbl ? e.clientX>=g.x : e.clientX>=g.x+g.W*.3) ? 1 : -1);
});
$('rClose').addEventListener('click', closeBook);
$('rPrev').addEventListener('click', ()=>go(-1));
$('rNext').addEventListener('click', ()=>go(1));
let rzT;
addEventListener('resize', ()=>{
  if (!R.open) return;
  clearTimeout(rzT);
  rzT = setTimeout(function re(){
    if (R.busy){ rzT = setTimeout(re, 200); return; }
    applyGeo();
    const step = R.geo.dbl?2:1; R.r = Math.min(R.r - R.r%step, maxR());
    render(); rig.style.transform = FIN; updUI();
  }, 150);
});

/* ---------- today's quiz ---------- */
/* Five questions per book; the first answer listed is the right one. Each day draws three per book and shuffles the options. */
const QBANK = {
 moby:[
  {q:"What is the name of Ahab's ship?", a:['The Pequod','The Rachel','The Essex','The Albatross']},
  {q:'What did the white whale take from Ahab?', a:['His leg','His first ship','His son','His left eye']},
  {q:'What does Ahab nail to the mast?', a:['A gold doubloon','A chart of the Pacific','A broken harpoon','A whale’s tooth']},
  {q:'How does Ishmael survive the sinking?', a:['Floating on Queequeg’s coffin','Clinging to the broken mast','In Starbuck’s whaleboat','Swimming to a nearby island']},
  {q:'Who argues that vengeance on a dumb animal is madness?', a:['Starbuck','Queequeg','Ishmael','Stubb']}],
 pride:[
  {q:'Which Bennet sister does Mr. Bingley fall for?', a:['Jane','Lydia','Mary','Kitty']},
  {q:'Whom does Mr. Collins marry after Elizabeth refuses him?', a:['Charlotte Lucas','Mary Bennet','Caroline Bingley','Georgiana Darcy']},
  {q:'Who runs off with Wickham?', a:['Lydia','Kitty','Georgiana','Charlotte']},
  {q:'How does Darcy answer Elizabeth’s angry refusal?', a:['With a long letter','By leaving for London','Through Mr. Bingley','By proposing again at once']},
  {q:'What is the name of Darcy’s estate?', a:['Pemberley','Netherfield','Longbourn','Rosings']}],
 frank:[
  {q:'Where does Victor learn to bring dead matter to life?', a:['At university in Ingolstadt','In his father’s house in Geneva','In a lab on the Orkneys','At a hospital in London']},
  {q:'Who hears Victor’s story first?', a:['Robert Walton, an Arctic explorer','Henry Clerval','Elizabeth Lavenza','A magistrate in Ireland']},
  {q:'What does the creature ask Victor to make for him?', a:['A companion','A new face','A home in the Alps','A cure for death']},
  {q:'Which book does the creature read while hiding by the cottage?', a:['Paradise Lost','The Odyssey','Hamlet','The Bible']},
  {q:'Where does the novel end?', a:['In the Arctic ice','In Geneva','High in the Alps','On a Scottish island']}],
 gatsby:[
  {q:'Who narrates the novel?', a:['Nick Carraway','Jay Gatsby','Jordan Baker','Tom Buchanan']},
  {q:'What does Gatsby gaze at across the bay?', a:['A green light on Daisy’s dock','A lighthouse','The Manhattan skyline','A red lantern on a yacht']},
  {q:'Who is driving the car that kills Myrtle?', a:['Daisy','Gatsby','Tom','Nick']},
  {q:'What was Gatsby’s name at birth?', a:['James Gatz','John Gates','Jacob Gatsberg','Jay Gould']},
  {q:'What does Gatsby want Daisy to say?', a:['That she never loved Tom','That she forgives him','That she will leave New York','That she loved him first']}],
 dune:[
  {q:'Where is the spice found?', a:['Only on Arrakis','On every desert world','On Caladan','In the Emperor’s mines']},
  {q:'What name does Paul take among the Fremen?', a:['Muad’Dib','Shai-Hulud','Kwisatz','Liet']},
  {q:'Who attacks House Atreides on Arrakis?', a:['The Harkonnens','The Fremen','The Spacing Guild','The Bene Gesserit']},
  {q:'What poison is only a Bene Gesserit supposed to survive?', a:['The Water of Life','Pure melange','Sandworm venom','Semuta']},
  {q:'How does Paul force the Emperor to yield?', a:['By holding the spice hostage','By assassinating him','With a Guild blockade','By winning a duel against him']}],
 orwell:[
  {q:'Where does Winston work?', a:['The Ministry of Truth','The Ministry of Love','The Ministry of Plenty','The Ministry of Peace']},
  {q:'What forbidden act begins Winston’s rebellion?', a:['Keeping a diary','Owning a radio','Visiting the proles','Reading Goldstein’s book']},
  {q:'Who turns out to be a loyal Party man all along?', a:['O’Brien','Julia','Goldstein','Parsons']},
  {q:'What must Winston believe two and two make?', a:['Five','Three','Four','Whatever he likes']},
  {q:'Where does Winston finally betray Julia?', a:['Room 101','The junk shop','The Chestnut Tree Café','The canteen']}],
 hobbit:[
  {q:'Who leads the thirteen dwarves?', a:['Thorin Oakenshield','Balin','Bard','Gandalf']},
  {q:'What does Bilbo find in the goblin tunnels?', a:['A magic ring','The Arkenstone','A map of the mountain','An elven sword']},
  {q:'Who kills Smaug?', a:['Bard the archer','Bilbo','Thorin','Beorn']},
  {q:'How does Bilbo free the dwarves from the Wood-elves?', a:['He floats them out in barrels','He digs a tunnel','He calls the eagles','He bribes the guards']},
  {q:'What does Bilbo secretly hand to Bard?', a:['The Arkenstone','His magic ring','A scale from Smaug','Thorin’s map']}],
 solitude:[
  {q:'What is the name of the town the Buendías found?', a:['Macondo','Aracataca','Comala','Riohacha']},
  {q:'How many uprisings does Colonel Aureliano lead?', a:['Thirty-two','Seven','Twelve','One hundred']},
  {q:'What does the colonel make in his workshop?', a:['Little gold fishes','Pocket watches','Silver crosses','Glass birds']},
  {q:'How long does the great rain last?', a:['Four years, eleven months and two days','Forty days and forty nights','One hundred days','Seven years']},
  {q:'What do Melquíades’ parchments turn out to hold?', a:['The family’s history, written in advance','A map to buried gold','Recipes for alchemy','Úrsula’s love letters']}]
};
const QZ = PICKS.flatMap(b => {
  const r = seeded('quiz:'+DAY+':'+b.k);
  return shuffle(QBANK[b.k].map((q,n)=>({...q,n})), r).slice(0,3).map((q,j)=>{
    const ord = shuffle([0,1,2,3], r);
    return {id:b.k+'-'+q.n, b, j, q:q.q, a:ord.map(o=>q.a[o]), c:ord.indexOf(0)};
  });
});
/* today's answers live in this browser only; the quiz still works if storage is unavailable */
const QKEY = 'folio:quiz:'+DAY;
let ANS = {};
try { ANS = JSON.parse(localStorage.getItem(QKEY)||'{}') || {}; } catch(_){}
const saveAns = () => { try { localStorage.setItem(QKEY, JSON.stringify(ANS)); } catch(_){} };
const hrsLeft = () => Math.ceil((new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+1) - new Date())/36e5);
const LONGDATE = NOW.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

/* shelf caption for the quiz: a little shelf of today's six spines, and a dot per question */
function quizGlyphs(){
  const done = QZ.filter(q=>q.id in ANS).length;
  const shelf = PICKS.map((b,i)=>`<i style="background:${b.base};height:${13+((i*5)%4)}px" data-tip="${b.title}"></i>`).join('');
  const dots = QZ.map(q=>`<i class="${q.id in ANS?'on':''}"></i>`).join('');
  return `<span class="g mshelf" aria-label="Covers today's six books">${shelf}</span><span class="dot"></span>
    <span class="g" tabindex="0" data-tip="${done ? `${done} of ${QZ.length} answered` : `${QZ.length} questions · three per book`}"><span class="qdots">${dots}</span></span>`;
}

const inkCircle = `<svg class="ink" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true">
  <path pathLength="1" d="M22 36 C8 16 92 5 160 6 S297 15 291 33 S212 57 142 55 S3 49 13 28 S66 8 116 7"/>
  <path class="i2" pathLength="1" d="M26 38 C12 18 94 7 161 8 S294 17 288 34 S210 55 143 53 S6 47 16 29"/></svg>`;
const strike = `<svg class="strike" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 6 C30 3.5 68 7.5 100 4"/></svg>`;
const bookDots = q => `<span class="bdots">${[0,1,2].map(j=>`<i class="${j<q.j?'p':j===q.j?'c':''}"></i>`).join('')}</span>`;
const fan = (mark) => `<div class="fan">${PICKS.map((b,i)=>{ const all = QZ.filter(q=>q.b===b).every(q=>q.id in ANS);
  return `<span class="fi" style="--a:${((i-2.5)*7).toFixed(1)}deg;--y:${(Math.abs(i-2.5)**2*.09).toFixed(2)}em" data-tip="${b.title}">${miniCover(b)}${mark&&all?'<b class="tick"></b>':''}</span>`; }).join('')}</div>`;

function quizPages(){
  const P = [quizTitle];
  QZ.forEach((q,k)=>{ if (R.geo.dbl) P.push(()=>quizVis(q)); P.push(()=>quizQ(q,k)); });
  if (R.geo.dbl) P.push(quizFinVis);
  P.push(quizFin);
  return P;
}
function quizTitle(){
  return `<div class="qp"><section class="opening"><span class="ico">${svgI(ICONS.quiz,30)}</span><h1>Recall</h1><p>${LONGDATE}</p>
    ${fan(false)}<blockquote>${QUIZ.one}</blockquote><div class="by">${QZ.length} questions</div></section></div>`;
}
function quizFront(){
  const row = (w,c='') => `<div class="dm ${c}"><i class="mk"></i><b style="width:${w}%"></b>${c==='right'?inkCircle:''}</div>`;
  return `<div class="fpage qfront"><div class="demo">${row(62)}${row(78,'right')}${row(54)}${row(70)}</div>
    <div class="legend"><span>${svgI('<circle cx="10" cy="10" r="3" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="7"/>',18)}pick one</span>
    <span>${svgI('<path d="M4 11c-1-4 4-6 8-6s6 2 5 5-5 5-9 4-4-2-4-3"/>',18)}the right answer is circled</span>
    <span>${svgI('<circle cx="10" cy="10" r="7.5" stroke-dasharray="2 2.4"/>',18)}no score</span></div></div>`;
}
function quizVis(q){
  return `<div class="fpage qvis">${miniCover(q.b,'big')}</div>`;
}
function quizQ(q,k){
  const ans = ANS[q.id], done = ans!=null;
  const opts = q.a.map((a,i)=>{
    const cls = !done ? '' : i===q.c ? 'right' : i===ans ? 'wrong' : 'dim';
    return `<li><button class="opt ${cls}${done&&i===ans?' chosen':''}" data-q="${q.id}" data-i="${i}"${done?' disabled':''}><i class="mk"></i><span>${a}${cls==='wrong'?strike:''}${cls==='right'?inkCircle:''}</span></button></li>`;
  }).join('');
  return `<div class="rh">${q.b.title}</div>
    <div class="qp qq${R.just===q.id?' now':''}">
      <div class="qhead">${R.geo.dbl ? '' : miniCover(q.b,'tiny')}${bookDots(q)}</div>
      <h3>${q.q}</h3><ol class="opts">${opts}</ol></div>
    <div class="fo">${k+1} · ${QZ.length}</div>`;
}
function quizFinVis(){
  return `<div class="fpage qfinv">${fan(true)}</div>`;
}
function quizFin(){
  const h = hrsLeft();
  return `<div class="qp"><section class="opening fin"><span class="ico">${svgI('<path d="M10 3l1.6 5.4L17 10l-5.4 1.6L10 17l-1.6-5.4L3 10l5.4-1.6z"/>',30)}</span>
    <h1>That’s today</h1>${R.geo.dbl ? '' : fan(true)}
    <blockquote>Tomorrow brings six new books, and new questions.</blockquote>
    <div class="g soon" tabindex="0" data-tip="New shelf in ${h} h">${ring(h/24*16)}</div></section></div>`;
}

/* answering: the choice is marked, the right answer circled in ink, and the page stays put so you can read it */
reader.addEventListener('click', e=>{
  const o = e.target.closest('.opt');
  if (!o || o.disabled || R.busy || !R.book || !R.book.quiz) return;
  const id = o.dataset.q;
  if (id in ANS) return;
  ANS[id] = +o.dataset.i; saveAns();
  R.just = id; setFace(rRight, R.r, 'l'); R.just = null;
  const nx = $('rNext'); nx.classList.remove('nudge'); void nx.offsetWidth; nx.classList.add('nudge');
});

select(0); layout(); requestAnimationFrame(tick);
})();
</script>
