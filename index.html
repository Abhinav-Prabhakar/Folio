const strike = `<svg class="strike" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M0 6 C30 3.5 68 7.5 100 4"/></svg>`;
const bookDots = q => `<span class="bdots">${[...Array(q.of).keys()].map(j=>`<i class="${j<q.j?'p':j===q.j?'c':''}"></i>`).join('')}</span>`;
const fan = (mark) => { const books = sessionBooks().slice(0, 8), n = books.length, mid = (n-1)/2;
  return `<div class="fan" style="font-size:${Math.min(1, 6.5/Math.max(n,1)).toFixed(2)}em">${books.map((b,i)=>{ const qs = QZ.filter(q=>q.b===b), all = qs.length && qs.every(q=>q.id in ANS);
  return `<span class="fi" style="--a:${((i-mid)*7).toFixed(1)}deg;--y:${(Math.abs(i-mid)**2*.09).toFixed(2)}em" data-tip="${escA(b.title)}">${miniCover(b)}${mark&&all?'<b class="tick"></b>':''}</span>`; }).join('')}</div>`; };
const inDays = n => n <= 0 ? 'today' : n === 1 ? 'tomorrow' : n < 14 ? `in ${n} days` : n < 60 ? `in ${Math.round(n/7)} weeks` : n < 700 ? `in ${Math.round(n/30)} months` : `in ${Math.round(n/365)} years`;

function quizPages(){
  const P = [quizTitle];
  QZ.forEach((q,k)=>{ if (R.geo.dbl) P.push(()=>quizVis(q)); P.push(()=>quizQ(q,k)); });
  if (R.geo.dbl) P.push(quizFinVis);
  P.push(quizFin);
  return P;
}
function quizTitle(){
  const nNew = QZ.filter(q => q.kind === 'new').length, nRev = QZ.length - nNew, st = memStats();
  const nextDue = Object.values(CARDS).reduce((m, c) => Math.min(m, c.due), Infinity);
  const line = QZ.length ? QUIZ.one
    : !Object.keys(READ).length ? 'Read a book to its last page, and its questions join your reviews.'
    : st.total ? `All caught up. Your next reviews are due ${inDays(nextDue - TODAY)}.`
    : 'Questions for the books you’ve read are on their way.';
  const by = QZ.length ? [nRev && `${nRev} to review`, nNew && `${nNew} new`].filter(Boolean).join(' · ') : st.total ? `${st.total} questions in memory` : 'no questions yet';
  return `<div class="qp"><section class="opening"><span class="ico">${svgI(ICONS.quiz,30)}</span><h1>Recall</h1><p>${LONGDATE}</p>
    ${fan(false)}<blockquote>${line}</blockquote><div class="by">${by}</div></section></div>`;
}
function quizFront(){
  const row = (w,c='') => `<div class="dm ${c}"><i class="mk"></i><b style="width:${w}%"></b>${c==='right'?inkCircle:''}</div>`;
  return `<div class="fpage qfront"><div class="demo">${row(62)}${row(78,'right')}${row(54)}${row(70)}</div>
    <div class="legend"><span>${svgI('<circle cx="10" cy="10" r="3" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="7"/>',18)}pick one</span>
    <span>${svgI('<path d="M4 11c-1-4 4-6 8-6s6 2 5 5-5 5-9 4-4-2-4-3"/>',18)}the right answer is circled</span>
    <span>${svgI('<path d="M3 14c3-7 6-9 7-9s3 5 7 9"/><circle cx="10" cy="5" r="1.2" fill="currentColor" stroke="none"/>',18)}it comes back just before you'd forget</span></div></div>`;
}
function quizVis(q){
  return `<div class="fpage qvis">${miniCover(q.b,'big')}</div>`;
}
function quizQ(q,k){
  const a = ANS[q.id], done = !!a, ans = a?.i;
  const opts = q.a.map((x,i)=>{
    const cls = !done ? '' : i===q.c ? 'right' : i===ans ? 'wrong' : 'dim';
    return `<li><button class="opt ${cls}${done&&i===ans?' chosen':''}" data-q="${q.id}" data-i="${i}"${done?' disabled':''}><i class="mk"></i><span>${esc(x)}${cls==='wrong'?strike:''}${cls==='right'?inkCircle:''}</span></button></li>`;
  }).join('');
  const card = CARDS[q.id];
  const conf = done && ans === q.c && MEM.confidence && a.g ? `<div class="conf" role="group" aria-label="How sure were you?">${[[2,'Hard'],[3,'Good'],[4,'Easy']].map(([g,l]) => `<button type="button" class="cf${a.g===g?' on':''}" data-q="${q.id}" data-g="${g}">${l}</button>`).join('')}</div>` : '';
  const next = done && card && a.g ? `<div class="nextrev">${svgI('<rect x="3" y="4.5" width="14" height="12.5" rx="1.2"/><path d="M3 8h14M7 3v3M13 3v3"/>',15)}back ${inDays(card.due - TODAY)}</div>` : '';
  return `<div class="rh">${esc(q.b.title)}</div>
    <div class="qp qq${R.just===q.id?' now':''}">
      <div class="qhead">${R.geo.dbl ? '' : miniCover(q.b,'tiny')}${bookDots(q)}${q.kind === 'review' ? '<span class="kind">review</span>' : ''}</div>
      <h3>${esc(q.q)}</h3><ol class="opts">${opts}</ol>${conf}${done && q.why ? `<p class="why">${esc(q.why)}</p>` : ''}${next}</div>
    <div class="fo">${k+1} · ${QZ.length}</div>`;
}
function quizFinVis(){
  return `<div class="fpage qfinv">${fan(true)}</div>`;
}
function quizFin(){
  const st = memStats(), mx = Math.max(1, ...st.week), day = d => new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate()+d).toLocaleDateString('en-GB',{weekday:'narrow'});
  const week = st.week.map((n,k) => `<span class="fcb" data-tip="${n} due ${inDays(k+1)}"><i style="height:${(4 + n/mx*44).toFixed(1)}px"></i><small>${day(k+1)}</small></span>`).join('');
  return `<div class="qp"><section class="opening fin"><span class="ico">${svgI('<path d="M10 3l1.6 5.4L17 10l-5.4 1.6L10 17l-1.6-5.4L3 10l5.4-1.6z"/>',30)}</span>
    <h1>That’s today</h1>${R.geo.dbl ? '' : fan(true)}
    <div class="fc" aria-label="Reviews due over the next week">${week}</div>
    <blockquote>${st.total ? 'Questions come back just before you’d forget them.' : 'Finish a book and its questions join your reviews.'}</blockquote>
    <div class="g soon" tabindex="0" data-tip="New shelf in ${hrsLeft()} h">${ring(hrsLeft()/24*16)}</div></section></div>`;
}

/* answering: the choice is marked, the right answer circled in ink, and the card is scheduled */
reader.addEventListener('click', e=>{
  if (!R.book || !R.book.quiz || R.busy) return;
  const cf = e.target.closest('.cf');
  if (cf){                                   // re-grade a right answer as Hard / Good / Easy
    const id = cf.dataset.q, a = ANS[id], g = +cf.dataset.g;
    if (!a || a.g === g) return;
    CARDS[id] = fsrs(a.prev, g, TODAY); a.g = g; saveCards(); saveAns(); setFace(rRight, R.r, 'l');
    return;
  }
  const o = e.target.closest('.opt');
  if (!o || o.disabled) return;
  const id = o.dataset.q, q = QZ.find(x => x.id === id);
  if (!q || ANS[id]) return;
  const i = +o.dataset.i, g = i === q.c ? 3 : 1, prev = CARDS[id] || null;
  CARDS[id] = fsrs(prev, g, TODAY); ANS[id] = {i, g, kind:q.kind, prev};
  saveCards(); saveAns();
  R.just = id; setFace(rRight, R.r, 'l'); R.just = null;
  const nx = $('rNext'); nx.classList.remove('nudge'); void nx.offsetWidth; nx.classList.add('nudge');
});

/* ---------- memory settings: a few plain controls, with the FSRS internals tucked under "Advanced" ---------- */
{
  const sheet = $('memSheet'), btn = $('rMem');
  const pct = v => Math.round(v*100);
  function draw(){
    const st = memStats(), tot = Math.max(1, st.total);
    sheet.innerHTML = `
      <div class="ms-k">memory</div>
      <div class="ms-bar" aria-label="Questions by memory strength">
        <i class="w" style="flex:${st.weak}" data-tip="${st.weak} still settling"></i><i class="gr" style="flex:${st.growing}" data-tip="${st.growing} growing"></i><i class="sg" style="flex:${st.strong}" data-tip="${st.strong} strong (3+ weeks)"></i>${st.total ? '' : '<i class="none" style="flex:1"></i>'}
      </div>
      <div class="ms-legend"><span><b class="w"></b>settling</span><span><b class="gr"></b>growing</span><span><b class="sg"></b>strong</span><span class="n">${st.total} cards · ${st.due} due</span></div>
      <label class="ms-row"><span>Remember</span><output id="msRetO">${pct(MEM.retention)}%</output></label>
      <input type="range" id="msRet" min="80" max="97" step="1" value="${pct(MEM.retention)}" aria-label="Target retention">
      <p class="ms-hint">Higher keeps more, but brings questions back sooner.</p>
      <div class="ms-row"><span>New questions a day</span><span class="ms-step"><button type="button" data-k="newPerDay" data-d="-1" aria-label="Fewer">−</button><b>${MEM.newPerDay}</b><button type="button" data-k="newPerDay" data-d="1" aria-label="More">+</button></span></div>
      <div class="ms-row"><span>Reviews a day, at most</span><span class="ms-step"><button type="button" data-k="maxReviews" data-d="-10" aria-label="Fewer">−</button><b>${MEM.maxReviews}</b><button type="button" data-k="maxReviews" data-d="10" aria-label="More">+</button></span></div>
      <label class="ms-row ms-sw"><span>Rate how sure I was</span><input type="checkbox" id="msConf" ${MEM.confidence ? 'checked' : ''}><i></i></label>
      <details class="ms-adv"><summary>Advanced</summary>
        <label class="ms-row"><span>Longest gap, in days</span><input type="number" id="msMax" min="30" max="36500" step="1" value="${MEM.maxIvl}"></label>
        <label class="ms-col"><span>FSRS parameters</span><textarea id="msW" rows="3" spellcheck="false" aria-label="FSRS parameters (19 numbers)">${MEM.w.map(x => +x.toFixed(4)).join(', ')}</textarea></label>
        <p class="ms-hint" id="msWHint">19 numbers, e.g. from the FSRS optimizer. Leave as is if unsure.</p>
        <div class="ms-btns"><button type="button" id="msDefaults">Restore defaults</button><button type="button" id="msForget">Forget all progress</button></div>
      </details>
      <p class="ms-foot">Changes apply from your next session.</p>`;
  }
  const open = v => { sheet.hidden = !v; btn.setAttribute('aria-expanded', v); if (v) draw(); };
  btn.addEventListener('click', e => { e.stopPropagation(); open(sheet.hidden); });
  sheet.addEventListener('pointerdown', e => e.stopPropagation());
  sheet.addEventListener('click', e => {
    e.stopPropagation();
    const s = e.target.closest('[data-k]');
    if (s){ const k = s.dataset.k, lim = k === 'newPerDay' ? [0, 50] : [10, 300];
      MEM[k] = Math.min(lim[1], Math.max(lim[0], MEM[k] + +s.dataset.d)); saveMem(); draw(); return; }
    if (e.target.id === 'msDefaults'){ Object.assign(MEM, structuredClone(MEM_DEFAULT)); MEM.w = FSRS_W.slice(); saveMem(); draw(); sheet.querySelector('.ms-adv').open = true; return; }
    if (e.target.id === 'msForget' && confirm('Forget all review history? Your read books stay marked as read.')){ CARDS = {}; saveCards(); ANS = {}; saveAns(); draw(); }
  });
  sheet.addEventListener('input', e => {
    if (e.target.id === 'msRet'){ MEM.retention = +e.target.value/100; $('msRetO').textContent = e.target.value+'%'; saveMem(); }
    if (e.target.id === 'msConf'){ MEM.confidence = e.target.checked; saveMem(); }
    if (e.target.id === 'msMax'){ const v = Math.round(+e.target.value); if (v >= 30 && v <= 36500){ MEM.maxIvl = v; saveMem(); } }
    if (e.target.id === 'msW'){
      const w = e.target.value.split(/[\s,]+/).filter(Boolean).map(Number), ok = validW(w);
      e.target.classList.toggle('bad', !ok); $('msWHint').textContent = ok ? 'Saved.' : `Needs 19 numbers (has ${w.length}).`;
      if (ok){ MEM.w = w; saveMem(); }
    }
  });
  document.addEventListener('click', () => { if (!sheet.hidden) open(false); });
  window.closeMemSheet = () => open(false);
}

function markRead(b){
  if (!b || b.quiz || READ[b.id]) return;
  READ[b.id] = DAY; store.set('folio:read', READ);
  const t = libGrid.querySelector(`.tile[data-n="${ALL.indexOf(b)}"]`); if (t) t.classList.add('done');
}
/* ---------- library: every book, searchable, filterable, sortable ---------- */
const lib = $('lib'), libGrid = $('libGrid'), libQ = $('libQ'), libChips = $('libChips');
let libBuilt = false, libCat = 'all', libSort = 'az', tiles = [], libKeys = [], libOrders = {};
const IC_CHECK = '<path d="M4.5 10.5l3.5 3.5 7.5-8"/>';
const IC_SPARK = '<path d="M10 3l1.6 5.4L17 10l-5.4 1.6L10 17l-1.6-5.4L3 10l5.4-1.6z"/>';
function buildLib(){
  libBuilt = true;
  const counts = new Map();
  FMB.forEach(b => b.cats.forEach(c => counts.set(c, (counts.get(c)||0)+1)));
  const cats = [...counts.entries()].sort((a,b) => b[1]-a[1]);
  const famIcon = c => ICONS[FAMILY_ICON[FAMILY_OF[c]]] || ICONS.peak;
  libChips.innerHTML = `<button class="chip on" data-cat="all" type="button">All <small>${ALL.length.toLocaleString()}</small></button>
    <button class="chip" data-cat="own" type="button">${svgI(IC_SPARK,13)}Folio originals <small>${LIB.length}</small></button>
    <button class="chip" data-cat="unread" type="button">${svgI('<circle cx="10" cy="10" r="6.5"/>',13)}Unread</button>
    <button class="chip" data-cat="read" type="button">${svgI(IC_CHECK,13)}Read <small id="readCount">${Object.keys(READ).length}</small></button>` +
    cats.map(([c,n]) => `<button class="chip" data-cat="${escA(c)}" type="button">${svgI(famIcon(c),13)}${esc(c)} <small>${n}</small></button>`).join('');
  libGrid.innerHTML = ALL.map((b,n) => `<button class="tile${READ[b.id] ? ' done' : ''}" type="button" data-n="${n}" aria-label="${escA(b.title + (b.author ? ' by '+b.author : ''))}">
    <span class="tc"><span class="ov light"></span><span class="ov hinge"></span>${b.own ? '<i class="badge" title="Folio original"></i>' : ''}<i class="seal" title="Read"></i></span>
    <span class="tt">${esc(b.title)}</span><span class="ta">${esc(b.author || (b.fmb ? b.primary : ''))}</span></button>`).join('');
  tiles = [...libGrid.children];
  libKeys = ALL.map(b => normT(b.title+' '+b.author+' '+(b.cats||[]).join(' ')));
  const idx = ALL.map((_,n) => n), byTitle = (a,b) => normT(ALL[a].title).localeCompare(normT(ALL[b].title));
  libOrders = {
    az: idx.slice().sort(byTitle),
    new: idx.slice().sort((a,b) => (ALL[b].added||'').localeCompare(ALL[a].added||'') || byTitle(a,b)),
    short: idx.slice().sort((a,b) => (ALL[a].fmb ? ALL[a].words : 520) - (ALL[b].fmb ? ALL[b].words : 520) || byTitle(a,b)),
  };
  /* covers are drawn only as tiles come near the screen */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    const t = e.target, b = ALL[+t.dataset.n];
    t.firstElementChild.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 300 450" preserveAspectRatio="none" aria-hidden="true">${coverSVG(b, 't'+t.dataset.n+'-', true)}</svg>`);
    io.unobserve(t);
  }), {root: lib, rootMargin: '700px 0px'});
  tiles.forEach(t => io.observe(t));
  if (!FMB.length) $('libOffline').innerHTML = '<br>The full library loads when Folio is served from a web address (it can’t be fetched from a local file).';
  filterLib();
}
function filterLib(){
  const words = normT(libQ.value).split(' ').filter(Boolean);
  let shown = 0;
  libOrders[libSort].forEach((n,k) => {
    const b = ALL[n], t = tiles[n];
    const ok = words.every(w => libKeys[n].includes(w)) && (libCat === 'all' || (libCat === 'own' ? b.own : libCat === 'read' ? !!READ[b.id] : libCat === 'unread' ? !READ[b.id] : (b.cats||[]).includes(libCat)));
    t.hidden = !ok; t.style.order = k; if (ok) shown++;
  });
  $('libCount').textContent = `${shown.toLocaleString()} ${shown === 1 ? 'book' : 'books'}`;
  $('libEmpty').hidden = shown > 0;
}
let libT;
libQ.addEventListener('input', () => { clearTimeout(libT); libT = setTimeout(filterLib, 110); });
libChips.addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  libCat = c.dataset.cat; libChips.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
  filterLib(); lib.scrollTo({top: 0, behavior: reduce ? 'auto' : 'smooth'});
});
lib.querySelector('.lib-sort').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  libSort = b.dataset.sort; lib.querySelectorAll('.lib-sort button').forEach(x => x.classList.toggle('on', x === b)); filterLib();
});
libGrid.addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const tc = t.querySelector('.tc');
  if (!tc.querySelector('svg')) tc.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 300 450" preserveAspectRatio="none" aria-hidden="true">${coverSVG(ALL[+t.dataset.n], 't'+t.dataset.n+'-', true)}</svg>`);
  openBook(null, {book: ALL[+t.dataset.n], el: tc});
});
function openLib(focus){
  if (!libBuilt) buildLib();
  lib.hidden = false; void lib.offsetWidth; lib.classList.add('open');
  if (focus) setTimeout(() => libQ.focus({preventScroll:true}), 80); else lib.focus?.();
}
function closeLib(){
  lib.classList.remove('open');
  setTimeout(() => { if (!lib.classList.contains('open')) lib.hidden = true; }, reduce ? 0 : 450);
}
$('libBtn').addEventListener('click', () => openLib(true));
$('libClose').addEventListener('click', closeLib);

/* ---------- books a day: 3 to 12; the shelf re-forms with the new count ---------- */
{
  const pop = $('perday'), dayEl = $('day');
  let n = PERDAY;
  const draw = () => {
    $('pdN').textContent = n; $('pdMinus').disabled = n <= 3; $('pdPlus').disabled = n >= 12;
    $('pdSpines').innerHTML = Array.from({length:n}, (_,k) => `<i style="height:${15+((k*7)%5)*2}px;animation-delay:${k*25}ms"></i>`).join('') + '<i class="q" style="height:21px"></i>';
    $('pdNote').textContent = n === PERDAY ? `New picks in ${hrsLeft()} h` : 'Your shelf will re-form when you close this';
  };
  const show = v => { pop.hidden = !v; dayEl.classList.toggle('open', v); if (v) draw(); };
  const apply = () => {
    if (n === PERDAY) return;
    try { localStorage.setItem(PERDAY_KEY, String(n)); } catch(_) {}
    document.body.classList.add('leaving'); setTimeout(() => location.reload(), reduce ? 0 : 360);
  };
  dayEl.addEventListener('click', e => { e.stopPropagation(); if (pop.hidden) show(true); else { show(false); apply(); } });
  dayEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); dayEl.click(); } });
  $('pdMinus').addEventListener('click', e => { e.stopPropagation(); n = Math.max(3, n-1); draw(); });
  $('pdPlus').addEventListener('click', e => { e.stopPropagation(); n = Math.min(12, n+1); draw(); });
  pop.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => { if (!pop.hidden){ show(false); apply(); } });
  addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden){ show(false); apply(); } });
}

/* ---------- theme: follows the device until you choose; the new theme spreads out from the switch ---------- */
{
  const root = document.documentElement, KEY = 'folio:theme', mq = matchMedia('(prefers-color-scheme: dark)');
  const btns = [$('theme'), $('themeR')];
  const saved = () => { try { return localStorage.getItem(KEY); } catch(_) { return null; } };
  const label = () => {
    const t = root.dataset.theme, other = t==='dark' ? 'light' : 'dark', auto = !saved();
    btns.forEach(b => { b.dataset.tip = auto ? `Matching your device · switch to ${other}` : `Switch to ${other}`;
      b.setAttribute('aria-label', `Switch to ${other} mode`); b.setAttribute('aria-pressed', t==='dark'); });
  };
  const paint = t => { root.dataset.theme = t; label(); };
  function setTheme(t, from){
    // choosing what the device already prefers hands control back to the device
    try { if (t === (mq.matches?'dark':'light')) localStorage.removeItem(KEY); else localStorage.setItem(KEY, t); } catch(_){}
    if (t === root.dataset.theme) return label();
    if (!document.startViewTransition || reduce || !from){
      root.classList.add('theming'); paint(t); setTimeout(()=>root.classList.remove('theming'), 700); return;
    }
    const r = from.getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
    const R = Math.hypot(Math.max(x, innerWidth-x), Math.max(y, innerHeight-y));
    const vt = document.startViewTransition(() => paint(t));
    vt.ready.then(() => root.animate({clipPath:[`circle(0px at ${x}px ${y}px)`, `circle(${R}px at ${x}px ${y}px)`]},
      {duration:820, easing:'cubic-bezier(.45,0,.2,1)', pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
  }
  btns.forEach(b => b.addEventListener('click', e => { e.stopPropagation(); setTheme(root.dataset.theme==='dark' ? 'light' : 'dark', b); }));
  btns[1].addEventListener('pointerdown', e => e.stopPropagation());
  mq.addEventListener('change', e => { if (!saved()) setTheme(e.matches ? 'dark' : 'light', null); });
  label();
}

select(0); layout(); requestAnimationFrame(tick);
})();
</script>
